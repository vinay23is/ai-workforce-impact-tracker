name: Discover events

# Automated DISCOVERY only. This never touches data/events and never publishes.
# It writes candidate review artifacts under data/candidates/ and opens a pull
# request for a human to review. Nothing here changes headline totals.
#
# Requires the repository setting:
#   Settings -> Actions -> General -> Workflow permissions ->
#     "Allow GitHub Actions to create and approve pull requests"  (enabled)
# Without it, GitHub blocks the PR-creation step. Do not work around this with a PAT.
#
# Note: GitHub disables scheduled workflows on public repos after ~60 days of no
# repository activity. Re-enable from the Actions tab (or push a commit) if that happens.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily (off-minute to avoid load spikes)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-events
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GDELT stays disabled unless explicitly enabled; SEC full-text search runs.
      - run: npm run discover
        env:
          DISCOVERY_ENABLE_GDELT: "0"
      - run: npm run validate:candidates
      - name: Detect new candidates
        id: changes
        run: |
          if [ -n "$(git status --porcelain data/candidates)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new candidates; nothing to open a PR for."
          fi
      - name: Open review pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: discovery/candidates
          base: main
          # Restrict the PR to candidate artifacts — it can never include data/events.
          add-paths: data/candidates/**
          commit-message: "Add discovered candidate events for review"
          title: "Discovered candidate events for review"
          body: |
            Automated discovery found potential AI-linked workforce events.

            These are **candidates only** — keyword/discovery matches, not verified events.
            They do not affect any public total. A human must verify the primary source and
            determine attribution before promoting any of them into `data/events/` via
            `npm run promote:candidate`.
          labels: discovery, needs-review
          delete-branch: true
