name: CI

# Quality checks only. Deployment is handled by Vercel's Git integration, not here.
# To disable this workflow, delete this file or turn off Actions in repo settings.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:data
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
